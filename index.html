function tracksHtml(items){if(!items.length)return `<div class="tracks empty music-empty"><div class="empty-symbol">♫</div><h3>Tu biblioteca empieza aquí.</h3><p>Sube tu primera canción y comienza a construir tu archivo musical.</p><button class="action" onclick="openUpload()">＋ &nbsp;Añadir música</button></div>`;return `<div class="tracks">${items.map(t=>`<div class="track ${S.current===t.id?'selected':''}"><button class="playround" title="Reproducir" aria-label="Reproducir ${esc(t.name)}" onclick="playTrack('${t.id}')">${playIcon(S.current===t.id&&S.playing)}</button><img src="${esc(t.cover||'assets/placeholder.svg')}" alt=""><div><div class="name" title="${esc(t.name)}">${esc(t.name)}</div><div class="meta">${esc(t.artist||'Brainstorm')} · ${esc(t.type||'Demo')}${t.demo?' · Ejemplo':''}</div></div><div class="technical">${esc(t.bpm||'—')}</div><div class="technical key">${esc(t.key||'—')}</div><div class="technical">${fmt(t.length||0)}</div><button class="heart ${t.liked?'liked':''}" title="Favorito" onclick="toggleLike('${t.id}')">${t.liked?'♥':'♡'}</button><button class="more dots" title="Opciones" onclick="openTrack('${t.id}')">···</button></div>`).join('')}</div>`}
function filteredTracks(){let a=[...allTracks()];if(S.view==='Favoritos')a=a.filter(t=>t.liked);if(S.view==='Recientes')a.reverse();if(S.filter!=='Todo')a=a.filter(t=>(t.type||'').toLowerCase()===S.filter.toLowerCase());if(S.q)a=a.filter(t=>(t.name+' '+t.artist+' '+t.type+' '+(t.bpm||'')+' '+(t.key||'')).toLowerCase().includes(S.q.toLowerCase()));return a}
function filterButtons(){return `<div class="filters">${['Todo','Demo','Master','Idea'].map(f=>`<button class="${f===S.filter?'active':''}" onclick="S.filter='${f}';render()">${({Todo:'Todo',Demo:'Demos',Master:'Masters',Idea:'Ideas'})[f]}</button>`).join('')}</div>`}
function flowPreview(){const t=S.tracks.find(t=>t.id===S.current);const count=S.tracks.filter(x=>!x.demo).length;return `<aside class="flow-preview glass-panel"><div class="preview-top"><span class="preview-icon">${flowMiniIcon()}</span><div><strong>FLOW</strong><small>Escucha más allá de la canción.</small></div><button class="preview-open" aria-label="Expandir FLOW" onclick="openFlow()">↗</button></div><p class="preview-desc">${t?'Explora la forma de onda y compara versiones de '+esc(t.name)+'.':'Reproduce una canción para explorar su sonido y comparar versiones.'}</p><button class="preview-wave" onclick="openFlow()" title="Abrir forma de onda interactiva"><span class="wave-bars">${Array.from({length:78},(_,i)=>{const h=8+Math.round((Math.abs(Math.sin(i*.47)*Math.sin(i*.11))+Math.abs(Math.sin(i*.21))*.3)*55);return `<i style="height:${Math.min(65,h)}px;opacity:${i<38?'.72':'.25'}"></i>`}).join('')}</span><span class="preview-wave-label">${t?'Abrir onda interactiva':'Abrir FLOW VIEW'} ${icon('forward')}</span></button><div class="preview-split"><strong>A/B Studio</strong><span>Comparación entre versiones</span></div><div class="preview-ab"><div><label>VERSIÓN A</label><button onclick="openFlow()">${esc(t?.name||'Seleccionar canción')} <span>⌄</span></button></div><div><label>VERSIÓN B</label><button onclick="openFlow()">${count>1?'Elegir versión':'Añade otra versión'} <span>⌄</span></button></div></div><div class="preview-controls"><button onclick="previousTrack()" aria-label="Anterior">${transportIcon('prev')}</button><button class="preview-play" onclick="togglePlay()" aria-label="${S.playing?'Pausar':'Reproducir'}">${playIcon(S.playing)}</button><button onclick="nextTrack()" aria-label="Siguiente">${transportIcon('next')}</button></div><button class="preview-full" onclick="openFlow()">Abrir FLOW Studio ${icon('forward')}</button></aside>`}
function homeView(){return `<div class="home-heading"><div><span class="kicker">BRAINSTORM VAULT</span><h1><span>Brainstorm</span> Vault</h1><p>Tu archivo musical privado</p></div></div><div class="home-layout"><div class="home-primary"><div class="hero-glass glass-panel"><div class="hero-mountains"></div><div class="hero-shine"></div><button class="hero-add" onclick="openUpload()">${icon('upload')} Añadir música</button></div><section class="section music-section"><div class="section-title recent-top"><div><h2>Mi música</h2><p class="section-subtitle">Tu colección personal, en un solo lugar.</p></div>${filterButtons()}</div>${tracksHtml(filteredTracks().slice().reverse())}</section></div>${flowPreview()}</div>`}

function otherView(){if(S.view==='Proyectos')return `<div class="viewhead"><div><h1>Proyectos</h1><p>Toda tu música, organizada por lanzamiento.</p></div><button class="action" onclick="openProject()">+ Nuevo proyecto</button></div><div class="projects projectspage">${S.projects.length?S.projects.map(projectCard).join(''):`<div class="empty-projects">Todavía no tienes proyectos. Puedes crearlos cuando quieras.</div>`}</div>`;if(S.view==='Ajustes')return `<div class="viewhead"><div><h1>Ajustes</h1><p>Tu archivo permanece en este navegador hasta conectar la nube.</p></div></div><div class="settingsrow"><div><strong>Almacenamiento local</strong><p>Se usa IndexedDB para guardar los archivos en este dispositivo.</p></div><button class="action secondary" onclick="showStorage()">Consultar uso</button></div><div class="settingsrow"><div><strong>Exportar catálogo</strong><p>Descarga los metadatos de tus canciones en formato JSON. No incluye archivos de audio.</p></div><button class="action secondary" onclick="exportCatalogue()">Exportar</button></div>`;return `<div class="viewhead"><div><h1>${esc(S.view)}</h1><p>${{Biblioteca:'Todas tus canciones en un solo lugar.',Favoritos:'Las canciones que guardaste para escuchar otra vez.',Recientes:'Tus últimas incorporaciones.'}[S.view]||''}</p></div><button class="action" onclick="openUpload()">+ Añadir música</button></div><section class="section"><div class="section-title recent-top"><h2>${S.view==='Favoritos'?'Tus favoritas':'Canciones'}</h2>${filterButtons()}</div>${tracksHtml(filteredTracks())}</section>`}
const audio=new Audio();audio.preload='metadata';audio.addEventListener('timeupdate',updatePlayer);audio.addEventListener('loadedmetadata',updatePlayer);audio.addEventListener('ended',()=>{if(S.repeat){audio.currentTime=0;audio.play()}else nextTrack()});
function player(){const t=S.tracks.find(t=>t.id===S.current);const progress=audio.duration?Math.round(audio.currentTime/audio.duration*100):0;return `<div class="player"><div class="now"><button class="cover-expand" onclick="openFlow()" title="Abrir FLOW VIEW" aria-label="Abrir reproductor expandido"><img src="${esc(t?.cover||'assets/placeholder.svg')}" alt=""></button><div class="player-meta"><div class="nowtitle">${esc(t?.name||'Selecciona una canción')}</div><div class="player-artistline"><small>${esc(t?.artist||'Brainstorm Vault')}</small>${t?.type?`<span class="player-badge">${esc(t.type)}</span>`:''}</div></div><button class="heart ${t?.liked?'liked':''}" title="Favorito" onclick="if(S.current)toggleLike(S.current)">${t?.liked?'♥':'♡'}</button></div><div class="centerdock"><div class="control-dock controls"><button title="Aleatorio" aria-label="Aleatorio" class="transport ${S.shuffle?'on':''}" onclick="S.shuffle=!S.shuffle;render()">${transportIcon('shuffle')}</button><button title="Anterior" aria-label="Anterior" class="transport skip" onclick="previousTrack()">${transportIcon('prev')}</button><button class="primary" aria-label="${S.playing?'Pausar':'Reproducir'}" title="${S.playing?'Pausar':'Reproducir'}" onclick="togglePlay()">${playIcon(S.playing)}</button><button title="Siguiente" aria-label="Siguiente" class="transport skip" onclick="nextTrack()">${transportIcon('next')}</button><button title="Repetir" aria-label="Repetir" class="transport ${S.repeat?'on':''}" onclick="S.repeat=!S.repeat;render()">${transportIcon('repeat')}</button></div><div class="player-rail"><div class="seek"><span id="elapsed">${fmt(audio.currentTime||0)}</span><input style="--progress:${progress}%" aria-label="Progreso de reproducción" id="seek" type="range" min="0" max="1000" value="${audio.duration?Math.round(audio.currentTime/audio.duration*1000):0}" oninput="seekAudio(this.value)"><span id="total">${fmt(t?.length||audio.duration||0)}</span></div></div></div><div class="utilitydock"><button class="flow-launch" onclick="openFlow()" title="Abrir BRAINSTORM FLOW">${flowMiniIcon()} <span>FLOW</span></button>${icon('volume')}<input type="range" min="0" max="100" value="${S.volume}" aria-label="Volumen" oninput="setVolume(this.value)"><button class="librarybtn" title="Biblioteca" onclick="setView('Biblioteca')">${icon('layers')}</button></div></div>`}
function render(){document.getElementById('app').innerHTML=sidebar()+`<main class="main"><div class="toolbar"><div class="top-arrows"><button class="iconbtn" onclick="history.back()" title="Atrás">${icon('back')}</button><button class="iconbtn" onclick="history.forward()" title="Adelante">${icon('forward')}</button></div><label class="search">${icon('search')}<input placeholder="Buscar en Brainstorm Vault..." value="${esc(S.q)}" oninput="S.q=this.value;refreshContent()"></label><button class="iconbtn" title="Añadir música" onclick="openUpload()">＋</button><button class="avatar" title="Ajustes" onclick="setView('Ajustes')">B</button></div><div id="content">${S.view==='Inicio'?homeView():otherView()}</div></main><button class="addfloating" onclick="openUpload()" aria-label="Añadir música">+</button>`+player();audio.volume=S.volume/100;updateStorage()}
function refreshContent(){document.getElementById('content').innerHTML=S.view==='Inicio'?homeView():otherView()}
function updatePlayer(){const el=document.getElementById('elapsed'),total=document.getElementById('total'),range=document.getElementById('seek');if(el)el.textContent=fmt(audio.currentTime||0);if(total)total.textContent=fmt(audio.duration||S.tracks.find(t=>t.id===S.current)?.length||0);if(range)range.value=audio.duration?audio.currentTime/audio.duration*1000:0;updateFlowProgress()}
function toast(message){const root=document.getElementById('toastroot');root.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(window._toast);window._toast=setTimeout(()=>root.innerHTML='',3100)}
function modal(html){document.getElementById('modalroot').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function openUpload(){modal(`<h2>Añadir música</h2><p class="hint">Importa tus propios archivos. Se almacenarán solamente en este navegador, no en GitHub.</p><form onsubmit="submitUpload(event)"><label class="field">Archivo de audio<input name="audiofile" type="file" accept="audio/*,.flac,.wav,.mp3,.m4a,.ogg" onchange="autoFillUpload(this.form)" required></label><p id="analysisStatus" class="analysis-status" role="status">Al elegir un archivo, intentaremos detectar BPM y tonalidad automáticamente.</p><label class="field">Título<input name="name" placeholder="Nombre de la canción"></label><label class="field">Artista<input name="artist" value="Brainstorm"></label><label class="field">Estado<select name="type"><option>Demo</option><option>Master</option><option>Idea</option><option>Lanzamiento</option></select></label><label class="field">Proyecto<select name="project"><option value="">Sin proyecto</option>${S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label class="field">Portada opcional<input name="coverfile" type="file" accept="image/*"></label><div style="display:flex;gap:12px"><label class="field" style="flex:1">BPM<input name="bpm" type="number" min="1" max="300" placeholder="Detectando..."></label><label class="field" style="flex:1">Tonalidad<input name="key" placeholder="Detectando..."></label></div><div class="modalactions"><button class="action secondary" type="button" onclick="closeModal()">Cancelar</button><button class="action" type="submit">Guardar canción</button></div></form>`)}
const field=(form,name)=>form.elements.namedItem(name);
const fileDataUrl=f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(f)});
const getDuration=f=>new Promise(resolve=>{let a=document.createElement('audio'),url=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{const v=a.duration;URL.revokeObjectURL(url);resolve(Number.isFinite(v)?v:0)};a.onerror=()=>{URL.revokeObjectURL(url);resolve(0)};a.src=url});
async function submitUpload(e){e.preventDefault();if(!db){toast('No está disponible el almacenamiento en este navegador.');return}const form=e.target,f=field(form,'audiofile').files[0];if(!f)return;const b=form.querySelector('[type=submit]');b.disabled=true;b.textContent='Guardando...';try{const id='track'+Date.now()+Math.random().toString(36).slice(2,7);const coverfile=field(form,'coverfile').files[0];const cover=coverfile?await fileDataUrl(coverfile):(S.projects.find(p=>p.id===field(form,'project').value)?.cover||'assets/placeholder.svg');const length=await getDuration(f);if(window._uploadAnalysisPromise)await window._uploadAnalysisPromise;await dbPut({id,file:f});const t={id,name:field(form,'name').value.trim()||f.name.replace(/\.[^.]+$/,''),artist:field(form,'artist').value||'Brainstorm',type:field(form,'type').value,bpm:field(form,'bpm').value?`${field(form,'bpm').value} BPM`:'',key:field(form,'key').value,project:field(form,'project').value,cover,length,date:new Date().toISOString().slice(0,10),liked:false,analysisMethod:window._uploadAnalysisOk?'web-audio-v1':null};S.tracks.push(t);persist();closeModal();render();toast('Canción guardada en tu navegador');await playTrack(id)}catch(err){b.disabled=false;b.textContent='Guardar canción';toast('No se pudo guardar el archivo. Revisa el espacio disponible.')}}
async function playTrack(id){const t=S.tracks.find(t=>t.id===id);if(!t)return;if(t.demo){toast('Esta canción es solo un ejemplo visual. Importa tu audio para reproducirlo.');return}if(S.current===id){togglePlay();return}if(!db){toast('No se pudo abrir el almacenamiento');return}try{const d=await dbGet(id);if(!d?.file){toast('Archivo de audio no encontrado en este dispositivo');return}audio.pause();if(S.objecturl)URL.revokeObjectURL(S.objecturl);S.objecturl=URL.createObjectURL(d.file);audio.src=S.objecturl;S.current=id;await audio.play();S.playing=true;render();refreshFlow()}catch(e){S.playing=false;render();toast('El navegador no pudo reproducir este formato.')}}
function togglePlay(){if(!S.current){const t=S.tracks.find(t=>!t.demo);if(t)playTrack(t.id);else toast('Primero añade una canción');return}if(audio.paused){audio.play().then(()=>{S.playing=true;render();refreshFlow()}).catch(()=>toast('No se pudo iniciar la reproducción'))}else{audio.pause();S.playing=false;render();refreshFlow()}}
function nextTrack(){const a=S.tracks.filter(t=>!t.demo);if(!a.length)return;if(S.shuffle)return playTrack(a[Math.floor(Math.random()*a.length)].id);let i=a.findIndex(t=>t.id===S.current);playTrack(a[(i+1+a.length)%a.length].id)}function previousTrack(){if(audio.currentTime>3){audio.currentTime=0;return}const a=S.tracks.filter(t=>!t.demo);if(!a.length)return;let i=a.findIndex(t=>t.id===S.current);playTrack(a[(i-1+a.length)%a.length].id)}function seekAudio(v){if(audio.duration)audio.currentTime=v/1000*audio.duration}function setVolume(v){S.volume=Number(v);audio.volume=S.volume/100;persist()}function toggleLike(id){const t=S.tracks.find(t=>t.id===id);if(t){t.liked=!t.liked;persist();render()}}
function openTrack(id){const t=S.tracks.find(t=>t.id===id);if(!t)return;modal(`<div class="details"><img src="${esc(t.cover)}"><div><h2>${esc(t.name)}</h2><p>${esc(t.artist)} · ${esc(t.type)}</p><p>${esc(t.bpm||'BPM sin detectar')} · ${esc(t.key||'Tonalidad sin detectar')}${t.analysisMethod?' · Estimación automática':''}</p></div></div><div class="trackactionbar">${t.demo?'':`<button class="chipaction ghost" onclick="reanalyzeTrack('${t.id}')"><span class="chipicon">${transportIcon('analyze')}</span>Analizar audio</button><button class="chipaction ghost" onclick="editTrack('${t.id}')">Editar</button><button class="chipaction danger" onclick="deleteTrack('${t.id}')">Eliminar</button>`}<button class="chipaction primary" onclick="closeModal();playTrack('${t.id}')">${playIcon(false)}Reproducir</button><button class="chipaction ghost" onclick="closeModal();openFlow()">${flowMiniIcon()} FLOW</button></div>`)}
function editTrack(id){const t=S.tracks.find(t=>t.id===id);if(!t)return;modal(`<h2>Editar canción</h2><p class="hint">Actualiza los datos de esta pista.</p><form onsubmit="saveTrack(event,'${id}')"><label class="field">Título<input name="name" value="${esc(t.name)}" required></label><label class="field">Artista<input name="artist" value="${esc(t.artist)}"></label><label class="field">Estado<select name="type">${['Demo','Master','Idea','Lanzamiento'].map(v=>`<option ${t.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Proyecto<select name="project"><option value="">Sin proyecto</option>${S.projects.map(p=>`<option value="${p.id}" ${p.id===t.project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Nueva portada (opcional)<input name="cover" type="file" accept="image/*"></label><div style="display:flex;gap:12px"><label class="field" style="flex:1">BPM<input name="bpm" type="number" value="${parseInt(t.bpm)||''}"></label><label class="field" style="flex:1">Tonalidad<input name="key" value="${esc(t.key||'')}"></label></div><div class="modalactions"><button type="button" class="action secondary" onclick="closeModal()">Cancelar</button><button class="action">Guardar cambios</button></div></form>`)}
async function saveTrack(e,id){e.preventDefault();const f=e.target,t=S.tracks.find(t=>t.id===id);if(!t)return;t.name=field(f,'name').value;t.artist=field(f,'artist').value;t.type=field(f,'type').value;t.project=field(f,'project').value;t.bpm=field(f,'bpm').value?field(f,'bpm').value+' BPM':'';t.key=field(f,'key').value;if(field(f,'cover').files[0])t.cover=await fileDataUrl(field(f,'cover').files[0]);persist();closeModal();render();toast('Cambios guardados')}
async function deleteTrack(id){if(!confirm('¿Eliminar esta canción de este navegador?'))return;await dbDel(id);S.tracks=S.tracks.filter(t=>t.id!==id);if(S.current===id){audio.pause();audio.removeAttribute('src');S.current=null;S.playing=false}persist();closeModal();render();toast('Canción eliminada')}
function showProject(id){const p=S.projects.find(p=>p.id===id);if(!p)return;const a=S.tracks.filter(t=>t.project===id);modal(`<div class="details"><img src="${esc(p.cover||'assets/placeholder.svg')}"><div><h2>${esc(p.name)}</h2><p>${esc(p.type||'Proyecto')}</p><p>${a.length} canciones importadas</p></div></div><div class="listheading">PISTAS DEL PROYECTO</div>${a.length?a.map(t=>`<div class="settingsrow"><span>${esc(t.name)}</span><button class="action secondary" onclick="closeModal();playTrack('${t.id}')">▶</button></div>`).join(''):'<p class="muted">Todavía no hay canciones importadas para este proyecto.</p>'}<div class="modalactions"><button class="action secondary" onclick="openProject('${p.id}')">Editar proyecto</button><button class="action" onclick="closeModal();openUpload()">+ Añadir música</button></div>`)}
function openProject(id){const p=S.projects.find(p=>p.id===id);modal(`<h2>${p?'Editar proyecto':'Nuevo proyecto'}</h2><p class="hint">Organiza tus demos, versiones y lanzamientos.</p><form onsubmit="saveProject(event,'${id||''}')"><label class="field">Nombre<input name="name" required value="${esc(p?.name||'')}" placeholder="Nombre del proyecto"></label><label class="field">Tipo<select name="type">${['Single','EP','Álbum','Colección','Proyecto'].map(v=>`<option ${p?.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Portada (opcional)<input type="file" name="cover" accept="image/*"></label><div class="modalactions"><button class="action secondary" type="button" onclick="closeModal()">Cancelar</button><button class="action">Guardar proyecto</button></div></form>`)}
async function saveProject(e,id){e.preventDefault();const f=e.target;let p=S.projects.find(p=>p.id===id);if(!p){p={id:'project'+Date.now(),cover:'assets/placeholder.svg',count:'0 canciones'};S.projects.push(p)}p.name=field(f,'name').value;p.type=field(f,'type').value;if(field(f,'cover').files[0])p.cover=await fileDataUrl(field(f,'cover').files[0]);persist();closeModal();render();toast('Proyecto guardado')}
function openCollection(){toast('Usa las colecciones Demo, Idea, Master y Lanzamiento al importar tus pistas.')}
function updateStorage(){const label=document.getElementById('sizeLabel');if(label){const n=S.tracks.filter(t=>!t.demo).length;label.textContent=`${n} archivo${n===1?'':'s'} local${n===1?'':'es'}`}}
async function showStorage(){if(navigator.storage?.estimate){const e=await navigator.storage.estimate();toast(`${(e.usage/1048576).toFixed(1)} MB usados en este origen · ${(e.quota/1048576).toFixed(0)} MB disponibles como cuota total`)}else toast('Tu navegador no proporciona estadísticas de almacenamiento')}
function exportCatalogue(){const data=JSON.stringify({version:'0.4',tracks:S.tracks.filter(t=>!t.demo),projects:S.projects},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='brainstorm-vault-catalogo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('.search input')?.focus()}if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();togglePlay()}});

// Iconografía vectorial de controles, consistente con la interfaz minimalista.
const transportIcon=(name)=>{const shapes={shuffle:'<path d="M3 7h3c5 0 6 10 12 10h3M17 13l4 4-4 4M3 17h3c2.5 0 4-2.5 5-5M16 7h5m-4-4 4 4-4 4"/>',prev:'<path d="M6 5v14"/><path d="M19 5 7 12l12 7V5z" fill="currentColor" stroke="none"/>',next:'<path d="M18 5v14"/><path d="M5 5l12 7-12 7V5z" fill="currentColor" stroke="none"/>',repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',analyze:'<path d="M3 12h3l2-6 4 12 3-8 2 2h4"/>'};return `<svg class="transport-svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${shapes[name]||''}</svg>`};
const playIcon=paused=>`<svg class="play-svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">${paused?'<rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/>':'<path d="M8 4.8c0-.8.9-1.2 1.6-.8l11 7.2a1 1 0 0 1 0 1.6l-11 7.2c-.7.4-1.6 0-1.6-.8z"/>'}</svg>`;
let analysisSerial=0;
function updateAnalysisStatus(message){const el=document.getElementById('analysisStatus');if(el)el.textContent=message;}
async function autoFillUpload(form){
  const f=field(form,'audiofile').files[0];if(!f)return;
  field(form,'name').value ||= f.name.replace(/\.[^.]+$/,'').replace(/[_-]/g,' ');
  const serial=++analysisSerial;
  window._uploadAnalysisOk=false;
  updateAnalysisStatus('Analizando el ritmo y la tonalidad en este dispositivo…');
  window._uploadAnalysisPromise=(async()=>{
    try {
      const result=await analyzeAudioFile(f);
      if(serial!==analysisSerial || !form.isConnected)return;
      if(result.bpm)field(form,'bpm').value=result.bpm;
      if(result.key)field(form,'key').value=result.key;
      window._uploadAnalysisOk=Boolean(result.bpm||result.key);
      updateAnalysisStatus('Estimación: '+(result.bpm?result.bpm+' BPM':'BPM no identificado')+' · '+(result.key||'Tonalidad no identificada')+'. Puedes corregir los campos.');
    }catch(e){if(serial!==analysisSerial)return;updateAnalysisStatus('No se pudo analizar automáticamente. Puedes rellenar BPM y tonalidad manualmente.');}
  })();
  return window._uploadAnalysisPromise;
}
async function reanalyzeTrack(id){
  const t=S.tracks.find(t=>t.id===id);if(!t||!db)return;
  closeModal();toast('Analizando «'+t.name+'»…');
  try{
    const record=await dbGet(id);if(!record?.file)throw Error('Archivo no disponible');
    const result=await analyzeAudioFile(record.file);
    if(result.bpm)t.bpm=result.bpm+' BPM';if(result.key)t.key=result.key;
    t.analysisMethod='web-audio-v1';persist();render();openTrack(id);
    toast('Análisis completado. Puedes editar los resultados.');
  }catch(e){toast('No se pudo analizar el archivo.');}
}
// FFT en JavaScript sin bibliotecas externas. No realiza solicitudes de red.
function fftPower(real){
  const n=real.length,imag=new Float32Array(n);
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){const v=real[i];real[i]=real[j];real[j]=v;}}
  for(let len=2;len<=n;len*=2){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<len/2;j++){
      const u=i+j,v=u+len/2,tr=real[v]*cr-imag[v]*ci,ti=real[v]*ci+imag[v]*cr;
      real[v]=real[u]-tr;imag[v]=imag[u]-ti;real[u]+=tr;imag[u]+=ti;
      const nc=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nc;
    }}
  }
  const powers=new Float32Array(n/2);for(let i=0;i<powers.length;i++)powers[i]=Math.sqrt(real[i]*real[i]+imag[i]*imag[i]);return powers;
}
function corr(a,b){let ma=0,mb=0;for(let i=0;i<a.length;i++){ma+=a[i];mb+=b[i]}ma/=a.length;mb/=b.length;let x=0,y=0,z=0;for(let i=0;i<a.length;i++){const p=a[i]-ma,q=b[i]-mb;x+=p*q;y+=p*p;z+=q*q}return x/Math.sqrt(y*z+1e-9)}
function findKey(chroma){
  const total=chroma.reduce((a,b)=>a+b,0);if(total<.001)return '';
  const major=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
  const minor=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
  const notes=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];let best={score:-2,key:''},second=-2;
  for(let root=0;root<12;root++)for(const [mode,profile] of [['major',major],['minor',minor]]){
    const template=profile.map((_,i)=>profile[(i-root+12)%12]);const score=corr(chroma,template);
    if(score>best.score){second=best.score;best={score,key:notes[root]+' '+mode}}else if(score>second)second=score;
  }
  return best.score<.38?'':best.key;
}
function findBpm(onsets,framesPerSecond){
  if(onsets.length<100)return null;
  // Auto-correlación de la envolvente de transitorios, con rango musical 70-190 BPM.
  let avg=onsets.reduce((a,b)=>a+b,0)/onsets.length;
  const centered=onsets.map(x=>Math.max(0,x-avg*.65));
  let winner=0,score=-1;
  for(let bpm=70;bpm<=190;bpm++){
    const lag=framesPerSecond*60/bpm;
    let a=0,b=0,c=0;
    for(let i=Math.ceil(lag);i<centered.length;i++){
      const idx=i-lag,k=Math.floor(idx),t=idx-k;const v=centered[k]*(1-t)+centered[Math.min(k+1,centered.length-1)]*t;
      a+=centered[i]*v;b+=centered[i]*centered[i];c+=v*v;
    }
    const q=a/Math.sqrt(b*c+1e-9);
    const neighborhood=(bpm>=90&&bpm<=155)?1.035:1;
    if(q*neighborhood>score){score=q*neighborhood;winner=bpm;}
  }
  return score>.12?winner:null;
}
async function analyzeAudioFile(file){
  if(file.size>110*1024*1024)throw Error('Archivo muy grande para análisis local');
  const ctx=new (window.AudioContext||window.webkitAudioContext)();let decoded;
  try{decoded=await ctx.decodeAudioData(await file.arrayBuffer());}finally{await ctx.close().catch(()=>{})}
  const duration=Math.min(decoded.duration,100),src=decoded.getChannelData(0),rate=decoded.sampleRate;
  const dstRate=11025,amount=Math.floor(duration*dstRate),samples=new Float32Array(amount);
  const step=rate/dstRate;
  for(let i=0;i<amount;i++){const pos=i*step,j=Math.floor(pos),frac=pos-j;samples[i]=(src[j]||0)*(1-frac)+(src[j+1]||0)*frac;}
  // Percusión: flujo espectral en ventanas cortas.
  const size=1024,hop=256,chroma=new Float64Array(12),onsets=[];
  const limit=Math.min(samples.length,80*dstRate);let previous=new Float32Array(size/2);
  for(let start=0;start+size<limit;start+=hop){
    const windowed=new Float32Array(size);for(let i=0;i<size;i++)windowed[i]=samples[start+i]*(.5-.5*Math.cos(2*Math.PI*i/(size-1)));
    const bins=fftPower(windowed);let flux=0;
    for(let k=3;k<bins.length;k++){const diff=bins[k]-previous[k];if(diff>0)flux+=diff;}
    previous=bins;onsets.push(flux);
  }
  // Tonalidad: cromagrama sobre FFT larga. Ponderación de frecuencias musicales.
  const longN=8192,longHop=8192,limitKey=Math.min(samples.length,65*dstRate);
  for(let start=0;start+longN<limitKey;start+=longHop){
    const windowed=new Float32Array(longN);
    for(let i=0;i<longN;i++)windowed[i]=samples[start+i]*(.5-.5*Math.cos(2*Math.PI*i/(longN-1)));
    const bins=fftPower(windowed);
    for(let k=55;k<Math.min(bins.length,1500);k++){
      const hz=k*dstRate/longN;if(hz<75||hz>1800)continue;
      const midi=69+12*Math.log2(hz/440),note=Math.round(midi),difference=Math.abs(midi-note);
      if(difference>.35)continue;
      const w=Math.pow(bins[k],1.12)*Math.max(0,1-difference/.35)/(1+hz/350);
      chroma[(note%12+12)%12]+=w;
    }
  }
  return {bpm:findBpm(onsets,dstRate/hop),key:findKey([...chroma])};
}


// FLOW View · decoded audio is analyzed only on this device; waveform is an amplitude overview.
const flowState={open:false,peaks:[],song:null,loading:false,serial:0,a:'',b:'',active:'a'};
function flowMiniIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12h2m2-4v8m4-12v16m4-13v10m4-7v4m4-2h-2"/></svg>'}
function openFlow(){if(!flowState.a&&S.current)flowState.a=S.current;flowState.open=true;refreshFlow();const t=S.tracks.find(t=>t.id===S.current);if(t&&!flowState.song)loadFlowWave(t.id)}
function closeFlow(){flowState.open=false;flowState.serial++;const root=document.getElementById('flowroot');if(root)root.innerHTML=''}
function flowTrackOptions(selected){return `<option value="">Seleccionar canción</option>${S.tracks.filter(t=>!t.demo).map(t=>`<option value="${esc(t.id)}" ${selected===t.id?'selected':''}>${esc(t.name)}${t.type?' · '+esc(t.type):''}</option>`).join('')}`}
function refreshFlow(){if(!flowState.open)return;const root=document.getElementById('flowroot');if(!root)return;const t=S.tracks.find(t=>t.id===S.current);const compatible=S.tracks.filter(t=>!t.demo);
 const details=t?`<div class="flow-identity"><img class="flow-art" src="${esc(t.cover||'assets/placeholder.svg')}" alt=""><div><div class="flow-title">${esc(t.name)}</div><div class="flow-author">${esc(t.artist||'Brainstorm')} · ${esc(t.type||'Música')}</div><div class="flow-chips"><span class="flow-chip">${esc(t.bpm||'BPM sin detectar')}</span><span class="flow-chip">${esc(t.key||'Tonalidad sin detectar')}</span><span class="flow-chip muted">${t.analysisMethod?'Estimación automática':'Metadatos'}</span></div></div></div>`:'<div class="flow-no-song"><h3>Tu música merece su propio espacio.</h3><p>Importa y reproduce una canción para ver su forma de onda.</p><button class="chipaction primary" onclick="closeFlow();openUpload()">Añadir música</button></div>';
 const wave=t?`<div class="flow-wave-wrap"><div class="flow-wave-info"><span class="flow-wave-label">FORMA DE ONDA</span><span id="flowWaveStatus" class="flow-wave-status">${flowState.loading?'Generando…':(flowState.song===t.id?'Interactiva · pulsa para navegar':'Preparando onda…')}</span></div><canvas id="flowWave" class="flow-wave" width="1100" height="160" role="slider" tabindex="0" aria-label="Navegar por la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" onclick="seekFlow(event)" onkeydown="keyFlow(event)"></canvas><div class="flow-ticks"><span id="flowElapsed">${fmt(audio.currentTime||0)}</span><span id="flowTotal">${fmt(audio.duration||t.length||0)}</span></div></div><div class="flow-controls"><button class="flow-ctrl" onclick="previousTrack();setTimeout(refreshFlow,80)" aria-label="Anterior">${transportIcon('prev')}</button><button class="flow-ctrl is-primary" onclick="togglePlay();setTimeout(refreshFlow,80)" aria-label="${S.playing?'Pausar':'Reproducir'}">${playIcon(S.playing)}</button><button class="flow-ctrl" onclick="nextTrack();setTimeout(refreshFlow,80)" aria-label="Siguiente">${transportIcon('next')}</button></div>`:'';
 const ab=compatible.length>1?`<section class="ab-panel"><div class="ab-heading"><div><strong>A/B Studio</strong><small>Compara dos versiones en la misma posición de tiempo.</small></div></div><div class="ab-options"><div class="ab-option"><label>VERSIÓN A</label><select aria-label="Versión A" onchange="setFlowChoice('a',this.value)">${flowTrackOptions(flowState.a||S.current)}</select></div><div class="ab-option"><label>VERSIÓN B</label><select aria-label="Versión B" onchange="setFlowChoice('b',this.value)">${flowTrackOptions(flowState.b)}</select></div></div><div class="ab-switchbar"><div class="ab-toggle"><button class="${flowState.active==='a'?'selected':''}" onclick="switchAB('a')">A</button><button class="${flowState.active==='b'?'selected':''}" onclick="switchAB('b')">B</button></div><span class="ab-note">Cambia sin perder el segundo actual. No iguala volumen ni alinea automáticamente versiones distintas.</span></div></section>`:`<section class="ab-panel"><div class="ab-heading"><div><strong>A/B Studio</strong><small>Importa otra versión de tu canción para compararlas.</small></div></div></section>`;
 root.innerHTML=`<div class="flow-mask" onclick="if(event.target===this)closeFlow()"><div class="flow-panel"><div class="flow-head"><span class="flow-kicker">BRAINSTORM / FLOW</span><button class="flow-close" onclick="closeFlow()" aria-label="Cerrar">×</button></div>${details}${wave}${ab}</div></div>`;
 if(t){drawFlowWave();if(flowState.song!==t.id&&!flowState.loading)loadFlowWave(t.id)}
}
function setFlowChoice(side,id){flowState[side]=id;if(side==='a'&&id&&!flowState.b)flowState.active='a';refreshFlow()}
async function switchAB(side){const id=flowState[side]||(side==='a'?S.current:'');if(!id){toast('Selecciona una canción para esa versión');return}if(side==='b'&&id===flowState.a){toast('Selecciona dos pistas diferentes');return}const target=S.tracks.find(t=>t.id===id);if(!target)return;if(id===S.current){flowState.active=side;refreshFlow();return}const preservedTime=audio.currentTime||0;const keepPlaying=!audio.paused;try{const rec=await dbGet(id);if(!rec?.file)throw Error('Audio no disponible');audio.pause();if(S.objecturl)URL.revokeObjectURL(S.objecturl);S.objecturl=URL.createObjectURL(rec.file);audio.src=S.objecturl;S.current=id;await new Promise((resolve,reject)=>{const ok=()=>{cleanup();resolve()};const fail=()=>{cleanup();reject(new Error('No se pudo cargar'))};const cleanup=()=>{audio.removeEventListener('loadedmetadata',ok);audio.removeEventListener('error',fail)};audio.addEventListener('loadedmetadata',ok);audio.addEventListener('error',fail);audio.load()});audio.currentTime=Math.max(0,Math.min(preservedTime,Math.max(0,(audio.duration||0)-.05)));if(keepPlaying)await audio.play();S.playing=keepPlaying;flowState.active=side;flowState.song=null;flowState.peaks=[];render();refreshFlow();}catch(err){toast('No se pudo cambiar de versión. Revisa el formato del audio.');refreshFlow()}}
function seekFlow(e){if(!audio.duration)return;const c=document.getElementById('flowWave');if(!c)return;const rect=c.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width))*audio.duration;updateFlowProgress()}
function keyFlow(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+(e.key==='ArrowRight'?5:-5)));updateFlowProgress()}}
async function loadFlowWave(id){if(!db)return;const serial=++flowState.serial;flowState.loading=true;flowState.song=null;flowState.peaks=[];const status=document.getElementById('flowWaveStatus');if(status)status.textContent='Analizando forma de onda…';try{const rec=await dbGet(id);if(!rec?.file)throw Error('Archivo no encontrado');if(rec.file.size>160*1024*1024)throw Error('Archivo demasiado grande');const buffer=await rec.file.arrayBuffer();const ctx=new (window.AudioContext||window.webkitAudioContext)();let decoded;try{decoded=await ctx.decodeAudioData(buffer)}finally{await ctx.close().catch(()=>{})}if(serial!==flowState.serial)return;const bucketCount=260,peaks=new Float32Array(bucketCount),channel=decoded.getChannelData(0),step=Math.max(1,Math.floor(channel.length/bucketCount));for(let i=0;i<bucketCount;i++){const start=i*step,end=Math.min(channel.length,start+step);let max=0;const stride=Math.max(1,Math.floor((end-start)/900));for(let j=start;j<end;j+=stride){const a=Math.abs(channel[j]);if(a>max)max=a}peaks[i]=max}let max=0;for(const p of peaks)max=Math.max(max,p);flowState.peaks=Array.from(peaks,x=>Math.max(.035,Math.sqrt(x/(max||1))));flowState.song=id;flowState.loading=false;drawFlowWave();const label=document.getElementById('flowWaveStatus');if(label)label.textContent='Interactiva · pulsa para navegar'}catch(e){if(serial!==flowState.serial)return;flowState.loading=false;const label=document.getElementById('flowWaveStatus');if(label)label.textContent='No se pudo generar la forma de onda';drawFlowWave()}}
function drawFlowWave(){const canvas=document.getElementById('flowWave');if(!canvas)return;const ctx=canvas.getContext('2d');if(!ctx)return;const w=canvas.width,h=canvas.height,mid=h/2;ctx.clearRect(0,0,w,h);const peaks=flowState.peaks.length?flowState.peaks:Array.from({length:260},()=>.07);const progress=audio.duration?Math.max(0,Math.min(1,audio.currentTime/audio.duration)):0;const bw=w/peaks.length;for(let i=0;i<peaks.length;i++){const height=Math.max(3,peaks[i]*(h*.83)),x=i*bw;ctx.fillStyle=i/peaks.length<=progress?'#202225':'#cdd1d6';const bar=Math.max(1.6,bw*.49);ctx.beginPath();ctx.roundRect(x,mid-height/2,bar,height,bar*.5);ctx.fill()}if(audio.duration){ctx.fillStyle='#202225';ctx.fillRect(progress*w-1,7,2,h-14)}canvas.setAttribute('aria-valuenow',String(Math.round(progress*100)))}
function updateFlowProgress(){if(!flowState.open)return;const e=document.getElementById('flowElapsed'),total=document.getElementById('flowTotal');if(e)e.textContent=fmt(audio.currentTime||0);if(total)total.textContent=fmt(audio.duration||0);drawFlowWave()}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&flowState.open)closeFlow()});

init();
