</style></head><body><div id="app" class="app"></div><div id="modalroot"></div><div id="toastroot"></div><script>
const S={view:'Inicio',filter:'Todo',q:'',tracks:[],projects:[{id:'dcm',name:"Don't Call Me Back",type:'EP',count:'4 canciones',cover:'assets/dont-call-me.webp'},{id:'caroline',name:'Caroline',type:'Single',count:'1 canción',cover:'assets/caroline.webp'},{id:'wfb',name:'Where Forever Begins',type:'Single',count:'1 canción',cover:'assets/where-forever.webp'},{id:'kid',name:'Still a Kid',type:'EP',count:'5 canciones',cover:'assets/still-a-kid.webp'},{id:'echo',name:'ECHOFLOW',type:'EP',count:'6 canciones',cover:'assets/echoflow.webp'}],current:null,playing:false,shuffle:false,repeat:false,volume:80,objecturl:null,modal:null};
const examples=[{id:'demo1',name:'Somebody to Love (Demo)',artist:'Brainstorm',type:'Demo',bpm:'128 BPM',key:'D minor',length:222,project:'wfb',cover:'assets/where-forever.webp',date:'2026-11-05',demo:true,liked:false}];
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M9 2h6l.6 2.4 2.1 1.2L20 4l3 5-1.9 1.7v2.6L23 15l-3 5-2.3-1.6-2.1 1.2L15 22H9l-.6-2.4-2.1-1.2L4 20l-3-5 1.9-1.7v-2.6L1 9l3-5 2.3 1.6 2.1-1.2z"/>',folder:'<path d="M3 6h7l2 2h9v11H3z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',back:'<path d="m15 5-7 7 7 7"/>',forward:'<path d="m9 5 7 7-7 7"/>',cloud:'<path d="M6 18a4 4 0 0 1-.3-8A7 7 0 0 1 19 9a4.5 4.5 0 0 1 0 9z"/>',volume:'<path d="M4 9h4l5-4v14l-5-4H4zM17 9a5 5 0 0 1 0 6"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 17v4h16v-4"/>'};
const icon=(n)=>`<svg class="ico" viewBox="0 0 24 24">${icons[n]||icons.music}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';
let db;const openDb=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('brainstorm-vault-v02',1);r.onupgradeneeded=()=>r.result.createObjectStore('audio',{keyPath:'id'});r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)});
const dbPut=o=>new Promise((resolve,reject)=>{const t=db.transaction('audio','readwrite'),r=t.objectStore('audio').put(o);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)});
const dbGet=id=>new Promise((resolve,reject)=>{const t=db.transaction('audio','readonly'),r=t.objectStore('audio').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const dbDel=id=>new Promise((resolve,reject)=>{const t=db.transaction('audio','readwrite'),r=t.objectStore('audio').delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)});
const persist=()=>localStorage.setItem('bv02-data',JSON.stringify({tracks:S.tracks.filter(t=>!t.demo),projects:S.projects,volume:S.volume}));
function init(){try{const data=JSON.parse(localStorage.getItem('bv02-data')||'{}');S.tracks=[...examples,...(data.tracks||[])];if(data.projects)S.projects=data.projects;S.volume=data.volume??80}catch{S.tracks=[...examples]}render();openDb().catch(()=>toast('Tu navegador no permite almacenamiento local.'));}
const allTracks=()=>S.tracks;function setView(v){S.view=v;S.filter='Todo';S.q='';render();window.scrollTo(0,0)}
function sidebar(){return `<aside class="sidebar"><div class="brand" onclick="setView('Inicio')"><div class="brandmark">B</div><div><strong>BRAINSTORM</strong><small>VAULT</small></div></div><nav class="nav">${[['Inicio','home'],['Biblioteca','music'],['Proyectos','layers'],['Favoritos','heart'],['Recientes','clock']].map(([label,i])=>`<button class="${S.view===label?'active':''}" onclick="setView('${label}')">${icon(i)}<span>${label}</span></button>`).join('')}</nav><div class="folder-head"><span>Colecciones</span><button title="Crear colección" onclick="openCollection()">+</button></div><div class="folders">${[['Demos & Ideas','Demo'],['Work in Progress','Idea'],['Masters Finales','Master'],['Lanzamientos','Lanzamiento']].map(([label,tag])=>`<button onclick="S.view='Biblioteca';S.filter='${tag}';render()">${icon('folder')}<span>${label}</span></button>`).join('')}</div><div class="storage"><div class="storage-head"><span class="cloud">${icon('cloud')}</span><div><strong>Almacenamiento</strong><small id="sizeLabel">Archivos locales del navegador</small></div></div><div class="progress-mini"><span id="usedbar"></span></div></div></aside>`}
function projectCard(p){return `<article class="project" onclick="showProject('${p.id}')"><img class="cover" src="${esc(p.cover||'assets/echoflow.webp')}" alt="Portada de ${esc(p.name)}"><div class="projectline"><h3>${esc(p.name)}</h3><button class="more" aria-label="Editar proyecto" onclick="event.stopPropagation();openProject('${p.id}')">···</button></div><p>${esc(p.type||'Proyecto')} · ${esc(p.count||'0 canciones')}</p></article>`}
function tracksHtml(items){if(!items.length)return `<div class="tracks empty">Todavía no hay canciones aquí. Pulsa «Añadir música» para comenzar.</div>`;return `<div class="tracks">${items.map(t=>`<div class="track ${S.current===t.id?'selected':''}"><button class="playround" title="Reproducir" onclick="playTrack('${t.id}')">${S.current===t.id&&S.playing?'Ⅱ':'▶'}</button><img src="${esc(t.cover||'assets/echoflow.webp')}" alt=""><div><div class="name" title="${esc(t.name)}">${esc(t.name)}</div><div class="meta">${esc(t.artist||'Brainstorm')} · ${esc(t.type||'Demo')}${t.demo?' · Ejemplo':''}</div></div><div class="technical">${esc(t.bpm||'—')}</div><div class="technical key">${esc(t.key||'—')}</div><div class="technical">${fmt(t.length||0)}</div><button class="heart ${t.liked?'liked':''}" title="Favorito" onclick="toggleLike('${t.id}')">${t.liked?'♥':'♡'}</button><button class="more dots" title="Opciones" onclick="openTrack('${t.id}')">···</button></div>`).join('')}</div>`}
function filteredTracks(){let a=[...allTracks()];if(S.view==='Favoritos')a=a.filter(t=>t.liked);if(S.view==='Recientes')a.reverse();if(S.filter!=='Todo')a=a.filter(t=>(t.type||'').toLowerCase()===S.filter.toLowerCase());if(S.q)a=a.filter(t=>(t.name+' '+t.artist+' '+t.type+' '+(t.bpm||'')+' '+(t.key||'')).toLowerCase().includes(S.q.toLowerCase()));return a}
function filterButtons(){return `<div class="filters">${['Todo','Demo','Master','Idea'].map(f=>`<button class="${f===S.filter?'active':''}" onclick="S.filter='${f}';render()">${({Todo:'Todo',Demo:'Demos',Master:'Masters',Idea:'Ideas'})[f]}</button>`).join('')}</div>`}
function homeView(){return `<div class="hero"><div class="hero-copy"><div class="overline">BRAINSTORM</div><h1>VAULT</h1><p>TU ARCHIVO MUSICAL PRIVADO</p><button class="pillbtn" onclick="setView('Biblioteca')">▶ &nbsp;Explorar mi música</button></div></div><section class="section"><div class="section-title"><h2>Proyectos</h2><button class="subtlebtn" onclick="setView('Proyectos')">Ver todos ›</button></div><div class="projects">${S.projects.slice(0,5).map(projectCard).join('')}</div></section><section class="section"><div class="section-title recent-top"><h2>Recientes</h2>${filterButtons()}</div>${tracksHtml(filteredTracks().slice().reverse().slice(0,6))}</section>`}
function otherView(){if(S.view==='Proyectos')return `<div class="viewhead"><div><h1>Proyectos</h1><p>Toda tu música, organizada por lanzamiento.</p></div><button class="action" onclick="openProject()">+ Nuevo proyecto</button></div><div class="projects projectspage">${S.projects.map(projectCard).join('')}</div>`;if(S.view==='Ajustes')return `<div class="viewhead"><div><h1>Ajustes</h1><p>Tu archivo permanece en este navegador hasta conectar la nube.</p></div></div><div class="settingsrow"><div><strong>Almacenamiento local</strong><p>Se usa IndexedDB para guardar los archivos en este dispositivo.</p></div><button class="action secondary" onclick="showStorage()">Consultar uso</button></div><div class="settingsrow"><div><strong>Exportar catálogo</strong><p>Descarga los metadatos de tus canciones en formato JSON. No incluye archivos de audio.</p></div><button class="action secondary" onclick="exportCatalogue()">Exportar</button></div>`;return `<div class="viewhead"><div><h1>${esc(S.view)}</h1><p>${{Biblioteca:'Todas tus canciones en un solo lugar.',Favoritos:'Las canciones que guardaste para escuchar otra vez.',Recientes:'Tus últimas incorporaciones.'}[S.view]||''}</p></div><button class="action" onclick="openUpload()">+ Añadir música</button></div><section class="section"><div class="section-title recent-top"><h2>${S.view==='Favoritos'?'Tus favoritas':'Canciones'}</h2>${filterButtons()}</div>${tracksHtml(filteredTracks())}</section>`}
const audio=new Audio();audio.preload='metadata';audio.addEventListener('timeupdate',updatePlayer);audio.addEventListener('loadedmetadata',updatePlayer);audio.addEventListener('ended',()=>{if(S.repeat){audio.currentTime=0;audio.play()}else nextTrack()});
function player(){const t=S.tracks.find(t=>t.id===S.current);return `<div class="player"><div class="now"><img src="${esc(t?.cover||'assets/echoflow.webp')}" alt=""><div style="min-width:0"><div class="nowtitle">${esc(t?.name||'Selecciona una canción')}</div><small>${esc(t?.artist||'Brainstorm Vault')}</small></div><button class="heart ${t?.liked?'liked':''}" title="Favorito" onclick="if(S.current)toggleLike(S.current)">${t?.liked?'♥':'♡'}</button></div><div class="controlarea"><div class="controls"><button title="Aleatorio" style="color:${S.shuffle?'#000':'#999'}" onclick="S.shuffle=!S.shuffle;render()">⤨</button><button title="Anterior" onclick="previousTrack()">◀❙</button><button class="primary" title="Pausar o reproducir" onclick="togglePlay()">${S.playing?'Ⅱ':'▶'}</button><button title="Siguiente" onclick="nextTrack()">❙▶</button><button title="Repetir" style="color:${S.repeat?'#000':'#999'}" onclick="S.repeat=!S.repeat;render()">↻</button></div><div class="seek"><span id="elapsed">${fmt(audio.currentTime||0)}</span><input aria-label="Progreso de reproducción" id="seek" type="range" min="0" max="1000" value="${audio.duration?Math.round(audio.currentTime/audio.duration*1000):0}" oninput="seekAudio(this.value)"><span id="total">${fmt(t?.length||audio.duration||0)}</span></div></div><div class="volume">${icon('volume')}<input type="range" min="0" max="100" value="${S.volume}" aria-label="Volumen" oninput="setVolume(this.value)"><button class="iconbtn" title="Biblioteca" onclick="setView('Biblioteca')">☷</button></div></div>`}
function render(){document.getElementById('app').innerHTML=sidebar()+`<main class="main"><div class="toolbar"><div class="top-arrows"><button class="iconbtn" onclick="history.back()" title="Atrás">${icon('back')}</button><button class="iconbtn" onclick="history.forward()" title="Adelante">${icon('forward')}</button></div><label class="search">${icon('search')}<input placeholder="Buscar en Brainstorm Vault..." value="${esc(S.q)}" oninput="S.q=this.value;refreshContent()"></label><button class="iconbtn" title="Añadir música" onclick="openUpload()">＋</button><button class="avatar" title="Ajustes" onclick="setView('Ajustes')">B</button></div><div id="content">${S.view==='Inicio'?homeView():otherView()}</div></main><button class="addfloating" onclick="openUpload()" aria-label="Añadir música">+</button>`+player();audio.volume=S.volume/100;updateStorage()}
function refreshContent(){document.getElementById('content').innerHTML=S.view==='Inicio'?homeView():otherView()}
function updatePlayer(){const el=document.getElementById('elapsed'),total=document.getElementById('total'),range=document.getElementById('seek');if(el)el.textContent=fmt(audio.currentTime||0);if(total)total.textContent=fmt(audio.duration||S.tracks.find(t=>t.id===S.current)?.length||0);if(range)range.value=audio.duration?audio.currentTime/audio.duration*1000:0}
function toast(message){const root=document.getElementById('toastroot');root.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(window._toast);window._toast=setTimeout(()=>root.innerHTML='',3100)}
function modal(html){document.getElementById('modalroot').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function openUpload(){modal(`<h2>Añadir música</h2><p class="hint">Importa tus propios archivos. Se almacenarán solamente en este navegador, no en GitHub.</p><form onsubmit="submitUpload(event)"><label class="field">Archivo de audio<input name="audiofile" type="file" accept="audio/*,.flac,.wav,.mp3,.m4a,.ogg" required></label><label class="field">Título<input name="name" placeholder="Nombre de la canción"></label><label class="field">Artista<input name="artist" value="Brainstorm"></label><label class="field">Estado<select name="type"><option>Demo</option><option>Master</option><option>Idea</option><option>Lanzamiento</option></select></label><label class="field">Proyecto<select name="project"><option value="">Sin proyecto</option>${S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label class="field">Portada opcional<input name="coverfile" type="file" accept="image/*"></label><div style="display:flex;gap:12px"><label class="field" style="flex:1">BPM<input name="bpm" type="number" min="1" max="300" placeholder="128"></label><label class="field" style="flex:1">Tonalidad<input name="key" placeholder="D minor"></label></div><div class="modalactions"><button class="action secondary" type="button" onclick="closeModal()">Cancelar</button><button class="action" type="submit">Guardar canción</button></div></form>`)}
const field=(form,name)=>form.elements.namedItem(name);
const fileDataUrl=f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(f)});
const getDuration=f=>new Promise(resolve=>{let a=document.createElement('audio'),url=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{const v=a.duration;URL.revokeObjectURL(url);resolve(Number.isFinite(v)?v:0)};a.onerror=()=>{URL.revokeObjectURL(url);resolve(0)};a.src=url});
async function submitUpload(e){e.preventDefault();if(!db){toast('No está disponible el almacenamiento en este navegador.');return}const form=e.target,f=field(form,'audiofile').files[0];if(!f)return;const b=form.querySelector('[type=submit]');b.disabled=true;b.textContent='Guardando...';try{const id='track'+Date.now()+Math.random().toString(36).slice(2,7);const coverfile=field(form,'coverfile').files[0];const cover=coverfile?await fileDataUrl(coverfile):(S.projects.find(p=>p.id===field(form,'project').value)?.cover||'assets/echoflow.webp');const length=await getDuration(f);await dbPut({id,file:f});const t={id,name:field(form,'name').value.trim()||field(f,'name').replace(/\.[^.]+$/,''),artist:field(form,'artist').value||'Brainstorm',type:field(form,'type').value,bpm:field(form,'bpm').value?`${field(form,'bpm').value} BPM`:'',key:field(form,'key').value,project:field(form,'project').value,cover,length,date:new Date().toISOString().slice(0,10),liked:false};S.tracks.push(t);persist();closeModal();render();toast('Canción guardada en tu navegador');await playTrack(id)}catch(err){b.disabled=false;b.textContent='Guardar canción';toast('No se pudo guardar el archivo. Revisa el espacio disponible.')}}
async function playTrack(id){const t=S.tracks.find(t=>t.id===id);if(!t)return;if(t.demo){toast('Esta canción es solo un ejemplo visual. Importa tu audio para reproducirlo.');return}if(S.current===id){togglePlay();return}if(!db){toast('No se pudo abrir el almacenamiento');return}try{const d=await dbGet(id);if(!d?.file){toast('Archivo de audio no encontrado en este dispositivo');return}audio.pause();if(S.objecturl)URL.revokeObjectURL(S.objecturl);S.objecturl=URL.createObjectURL(d.file);audio.src=S.objecturl;S.current=id;await audio.play();S.playing=true;render()}catch(e){S.playing=false;render();toast('El navegador no pudo reproducir este formato.')}}
function togglePlay(){if(!S.current){const t=S.tracks.find(t=>!t.demo);if(t)playTrack(t.id);else toast('Primero añade una canción');return}if(audio.paused){audio.play().then(()=>{S.playing=true;render()}).catch(()=>toast('No se pudo iniciar la reproducción'))}else{audio.pause();S.playing=false;render()}}
function nextTrack(){const a=S.tracks.filter(t=>!t.demo);if(!a.length)return;if(S.shuffle)return playTrack(a[Math.floor(Math.random()*a.length)].id);let i=a.findIndex(t=>t.id===S.current);playTrack(a[(i+1+a.length)%a.length].id)}function previousTrack(){if(audio.currentTime>3){audio.currentTime=0;return}const a=S.tracks.filter(t=>!t.demo);if(!a.length)return;let i=a.findIndex(t=>t.id===S.current);playTrack(a[(i-1+a.length)%a.length].id)}function seekAudio(v){if(audio.duration)audio.currentTime=v/1000*audio.duration}function setVolume(v){S.volume=Number(v);audio.volume=S.volume/100;persist()}function toggleLike(id){const t=S.tracks.find(t=>t.id===id);if(t){t.liked=!t.liked;persist();render()}}
function openTrack(id){const t=S.tracks.find(t=>t.id===id);if(!t)return;modal(`<div class="details"><img src="${esc(t.cover)}"><div><h2>${esc(t.name)}</h2><p>${esc(t.artist)} · ${esc(t.type)}</p><p>${esc(t.bpm||'')} ${esc(t.key||'')}</p></div></div><div class="modalactions"><button class="action secondary" onclick="toggleLike('${t.id}');closeModal()">${t.liked?'Quitar favorito':'Favorito'}</button>${t.demo?'':`<button class="action secondary" onclick="editTrack('${t.id}')">Editar</button><button class="action secondary" onclick="deleteTrack('${t.id}')">Eliminar</button>`}<button class="action" onclick="closeModal();playTrack('${t.id}')">▶ Reproducir</button></div>`)}
function editTrack(id){const t=S.tracks.find(t=>t.id===id);if(!t)return;modal(`<h2>Editar canción</h2><p class="hint">Actualiza los datos de esta pista.</p><form onsubmit="saveTrack(event,'${id}')"><label class="field">Título<input name="name" value="${esc(t.name)}" required></label><label class="field">Artista<input name="artist" value="${esc(t.artist)}"></label><label class="field">Estado<select name="type">${['Demo','Master','Idea','Lanzamiento'].map(v=>`<option ${t.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Proyecto<select name="project"><option value="">Sin proyecto</option>${S.projects.map(p=>`<option value="${p.id}" ${p.id===t.project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Nueva portada (opcional)<input name="cover" type="file" accept="image/*"></label><div style="display:flex;gap:12px"><label class="field" style="flex:1">BPM<input name="bpm" type="number" value="${parseInt(t.bpm)||''}"></label><label class="field" style="flex:1">Tonalidad<input name="key" value="${esc(t.key||'')}"></label></div><div class="modalactions"><button type="button" class="action secondary" onclick="closeModal()">Cancelar</button><button class="action">Guardar cambios</button></div></form>`)}
async function saveTrack(e,id){e.preventDefault();const f=e.target,t=S.tracks.find(t=>t.id===id);if(!t)return;t.name=field(f,'name').value;t.artist=field(f,'artist').value;t.type=field(f,'type').value;t.project=field(f,'project').value;t.bpm=field(f,'bpm').value?field(f,'bpm').value+' BPM':'';t.key=field(f,'key').value;if(field(f,'cover').files[0])t.cover=await fileDataUrl(field(f,'cover').files[0]);persist();closeModal();render();toast('Cambios guardados')}
async function deleteTrack(id){if(!confirm('¿Eliminar esta canción de este navegador?'))return;await dbDel(id);S.tracks=S.tracks.filter(t=>t.id!==id);if(S.current===id){audio.pause();audio.removeAttribute('src');S.current=null;S.playing=false}persist();closeModal();render();toast('Canción eliminada')}
function showProject(id){const p=S.projects.find(p=>p.id===id);if(!p)return;const a=S.tracks.filter(t=>t.project===id);modal(`<div class="details"><img src="${esc(p.cover||'assets/echoflow.webp')}"><div><h2>${esc(p.name)}</h2><p>${esc(p.type||'Proyecto')}</p><p>${a.length} canciones importadas</p></div></div><div class="listheading">PISTAS DEL PROYECTO</div>${a.length?a.map(t=>`<div class="settingsrow"><span>${esc(t.name)}</span><button class="action secondary" onclick="closeModal();playTrack('${t.id}')">▶</button></div>`).join(''):'<p class="muted">Todavía no hay canciones importadas para este proyecto.</p>'}<div class="modalactions"><button class="action secondary" onclick="openProject('${p.id}')">Editar proyecto</button><button class="action" onclick="closeModal();openUpload()">+ Añadir música</button></div>`)}
function openProject(id){const p=S.projects.find(p=>p.id===id);modal(`<h2>${p?'Editar proyecto':'Nuevo proyecto'}</h2><p class="hint">Organiza tus demos, versiones y lanzamientos.</p><form onsubmit="saveProject(event,'${id||''}')"><label class="field">Nombre<input name="name" required value="${esc(p?.name||'')}" placeholder="Nombre del proyecto"></label><label class="field">Tipo<select name="type">${['Single','EP','Álbum','Colección','Proyecto'].map(v=>`<option ${p?.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Portada (opcional)<input type="file" name="cover" accept="image/*"></label><div class="modalactions"><button class="action secondary" type="button" onclick="closeModal()">Cancelar</button><button class="action">Guardar proyecto</button></div></form>`)}
async function saveProject(e,id){e.preventDefault();const f=e.target;let p=S.projects.find(p=>p.id===id);if(!p){p={id:'project'+Date.now(),cover:'assets/echoflow.webp',count:'0 canciones'};S.projects.push(p)}p.name=field(f,'name').value;p.type=field(f,'type').value;if(field(f,'cover').files[0])p.cover=await fileDataUrl(field(f,'cover').files[0]);persist();closeModal();render();toast('Proyecto guardado')}
function openCollection(){toast('Usa las colecciones Demo, Idea, Master y Lanzamiento al importar tus pistas.')}
function updateStorage(){const label=document.getElementById('sizeLabel');if(label){const n=S.tracks.filter(t=>!t.demo).length;label.textContent=`${n} archivo${n===1?'':'s'} local${n===1?'':'es'}`}}
async function showStorage(){if(navigator.storage?.estimate){const e=await navigator.storage.estimate();toast(`${(e.usage/1048576).toFixed(1)} MB usados en este origen · ${(e.quota/1048576).toFixed(0)} MB disponibles como cuota total`)}else toast('Tu navegador no proporciona estadísticas de almacenamiento')}
function exportCatalogue(){const data=JSON.stringify({version:'0.2',tracks:S.tracks.filter(t=>!t.demo),projects:S.projects},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='brainstorm-vault-catalogo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('.search input')?.focus()}if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();togglePlay()}});
init();
</script></body></html>
